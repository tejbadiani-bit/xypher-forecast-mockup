<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DXR Forecast — concept mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#a6ff33;--cyan:#00ffff;--ink:#1d1d1b;--text:#2b303a;--head:#1d1d1b;--muted:#5d626c;--dim:#8a8e96;
  --accent:#3b7a00;--cyan-t:#00808a;--cyan-f:#9ff3f3;
  --bg:#ffffff;--s1:rgba(43,48,58,.045);--s2:rgba(43,48,58,.07);--s3:rgba(43,48,58,.11);
  --line:rgba(43,48,58,.12);--line2:rgba(43,48,58,.22);
  --warn:#b7791f;--bad:#c93c3c;--ok:#2f8f2f;--r:22px;--r2:12px;
  --inset:rgba(0,0,0,.03) 1px 1px 0 0 inset;--shadow:0 18px 50px rgba(29,29,27,.16);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;color:var(--head);letter-spacing:-.015em}
h1{font-size:30px;line-height:1.12;font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
a{color:var(--cyan-t)}

/* shell */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--head);white-space:nowrap}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ink);position:relative;overflow:hidden}
.mark:before{content:"";position:absolute;inset:8px -4px auto auto;width:26px;height:8px;background:var(--lime);transform:skewX(-24deg)}
.mark:after{content:"";position:absolute;left:-4px;bottom:7px;width:22px;height:6px;background:var(--cyan);transform:skewX(-24deg)}
.brand .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;border-left:1px solid var(--line2);padding-left:12px}
.nav{display:flex;gap:2px;background:rgba(43,48,58,.035);box-shadow:var(--inset);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--s2)}
.nav button.on{background:var(--ink);color:#fff}
.ctrls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.seg{display:flex;background:rgba(43,48,58,.035);box-shadow:var(--inset);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
select.pill{background:#fff;border:1.5px solid var(--line2);border-radius:999px;padding:6px 30px 6px 12px;font-weight:600;font-size:13px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text) 50%),linear-gradient(135deg,var(--text) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn.dark{background:var(--ink);color:#fff}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:var(--s2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.banner{background:var(--ink);color:#e9eaec;font-size:12.5px;text-align:center;padding:6px 16px}
.banner b{color:var(--lime)}
main{max-width:1320px;margin:0 auto;padding:22px 20px 80px}

/* building blocks */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero p{margin:6px 0 0;color:var(--muted);max-width:760px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--s2);white-space:nowrap}
.badge.open{background:#eaffd2;color:var(--accent)}
.badge.locked{background:var(--ink);color:#fff}
.badge.warn{background:#fff3dc;color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(142px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.dark{background:var(--ink);color:#e9eaec;border-color:var(--ink)}
.card.dark h2,.card.dark h3{color:#fff}
.card h2{margin-bottom:4px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.kpi .l{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:24px;font-weight:700;color:var(--head);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;margin-top:2px;color:var(--muted)}
.kpi.hl{background:var(--ink);border-color:var(--ink)}
.kpi.hl .l{color:#b9bcc2}.kpi.hl .v{color:var(--lime)}.kpi.hl .d{color:#cfd1d5}
.two{grid-template-columns:1.35fr 1fr}
.half{grid-template-columns:1fr 1fr}
@media (max-width:980px){.two,.half{grid-template-columns:1fr}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:1.5px solid var(--line2);background:var(--s1)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--s1)}
tr.sub td{font-size:13px;color:var(--muted)}
tr.sub td:first-child{padding-left:28px}
.bar{height:8px;border-radius:5px;background:var(--s2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.6;margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin:1px 3px 1px 0;white-space:nowrap}
.t-new{background:#e6f7ff;color:#0a6b8a}.t-won{background:#e3f6e3;color:var(--ok)}.t-lost{background:#fde8e8;color:var(--bad)}
.t-push{background:#fde8e8;color:var(--bad)}.t-pull{background:#eaffd2;color:var(--accent)}.t-up{background:#eaffd2;color:var(--accent)}
.t-down{background:#fff3dc;color:var(--warn)}.t-amt{background:var(--s2);color:var(--text)}.t-ovr{background:var(--ink);color:var(--lime)}
.t-due{background:#fff3dc;color:var(--warn)}
.deal b{display:block;color:var(--head);font-weight:600}
.deal span{font-size:12px;color:var(--muted)}
.was{display:block;font-size:11.5px;color:var(--dim);text-decoration:line-through}
td select{border:1.5px solid var(--line2);border-radius:8px;padding:4px 6px;background:#fff;font-size:13px;font-weight:600}
td select.ovr{border-color:var(--ink);background:#f6ffe9}
td input.note{border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:100%;min-width:170px;font-size:12.5px}
.cat{font-weight:600;font-size:12.5px;white-space:nowrap}
.cat.Commit{color:var(--accent)}.cat.Best{color:var(--cyan-t)}.cat.Closed{color:var(--ink)}.cat.Omitted,.cat.Omit{color:var(--dim)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.inp,textarea{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:8px 10px;background:#fff;font-size:13.5px}
textarea{min-height:64px;resize:vertical}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mover{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.mover:last-child{border-bottom:0}
.mover .a{font-weight:600;color:var(--head)}
.mover .b{font-size:12px;color:var(--muted)}
.mover .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.note-box{background:var(--s1);border-radius:var(--r2);padding:12px 14px;font-size:13px;color:var(--muted)}
.note-box b{color:var(--text)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:var(--r2);padding:14px;position:relative}
.step .when{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.step h3{margin:4px 0 6px}
.step p{margin:0;font-size:13px;color:var(--muted)}
.step.now{border:2px solid var(--ink)}
.step.now:after{content:"YOU ARE HERE";position:absolute;top:-9px;right:12px;background:var(--lime);font-size:10px;font-weight:800;padding:1px 7px;border-radius:5px}
.obj{border:1.5px solid var(--line2);border-radius:var(--r2);overflow:hidden}
.obj .h{background:var(--ink);color:#fff;padding:9px 12px;font-weight:700;font-size:13.5px}
.obj .h span{color:var(--lime);font-weight:500;font-size:12px;margin-left:6px}
.obj ul{margin:0;padding:10px 12px 12px 28px;font-size:12.5px;color:var(--muted)}
.obj li{margin:2px 0}
.obj code{color:var(--text);font-size:12px}
.arrow{text-align:center;color:var(--dim);font-size:12px;padding:4px 0}
.tree{font-size:13.5px}
.tree .p{font-weight:700;color:var(--head);margin-top:10px}
.tree .u{margin-left:16px;color:var(--text)}
.tree .u span{color:var(--muted);font-size:12.5px}
ul.tight{margin:6px 0 0;padding-left:18px}
ul.tight li{margin:3px 0}
.lockbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(29,29,27,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:var(--r);max-width:560px;width:100%;padding:22px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:6px}
.modal .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:var(--lime)}
.rt-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:baseline}
.rsteps{grid-template-columns:repeat(4,1fr)}@media (max-width:820px){.rsteps{grid-template-columns:1fr 1fr}}
svg text{font-family:"Instrument Sans",system-ui,sans-serif}
@media (max-width:640px){main{padding:16px 16px 60px}h1{font-size:24px}.top-in{padding:10px 16px}.ctrls{margin-left:0}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="mark"></div>DXR Cyber <span class="tag">Weekly Forecast</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="ctrls">
    <select class="pill" id="weekSel" aria-label="Forecast week"></select>
    <div class="seg" id="measureSeg"><button data-m="rev" class="on">Revenue in Year</button><button data-m="gp">GP in Year</button></div>
    <span id="statusBadge"></span>
    <button class="btn dark" id="lockBtn">Lock &amp; snapshot</button>
  </div>
</div></header>
<div class="banner">Concept mock-up of a Salesforce LWC · <b>fictional accounts and figures</b> · names abbreviated · DXR Cyber financial year April–March (FY27 = Apr 2026–Mar 2027) · bookings → revenue via the revenue schedule · design ref XYP-FCST-001</div>
<main id="app"></main>
<div id="modalHost"></div>
<div id="toast"></div>

<script>
/* ---------- deterministic fake data ---------- */
let seed = 20261211;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const iso=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const randDate=(a,b)=>addDays(a,ri(0,dayDiff(a,b)));
const fmtDate=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});

const Q={label:'FY27 Q3',start:'2026-10-01',end:'2026-12-31',weeks:13,week:11,fri:'2026-12-11',prevFri:'2026-12-04'};
const PILLARS={
  AM:{name:'Account Management',short:'AM',units:['am-st','am-ht']},
  BD:{name:'Business Development',short:'BD',units:['bd']},
  CA:{name:'Channel & Alliances',short:'C&A',units:['ca']}
};
const UNITS=[
  {key:'am-st',pillar:'AM',name:'AM · Sarah T. pod',mgr:'Sarah T.',reps:['Laura P.','Bella R.','Michael P.','Josh W.','Jonny C.','Simron R.','Lucy D.'],status:'Submitted',subAt:'Thu 16:42',
   adj:{cur:0,prior:0,reason:''},risks:'Ravensworth renewal: procurement now wants 3 quotes, so it could slip into Feb.',upside:'Two expansion MDR seats at existing logos if security budgets are released before Christmas.'},
  {key:'am-ht',pillar:'AM',name:'AM · Harry T. pod',mgr:'Harry T.',reps:['Michael B.','James D.','Simon P.','Peter F.','Luke P.','Leah R.','Harvey R.'],status:'Submitted',subAt:'Thu 17:05',
   adj:{cur:8000,prior:8000,reason:'NHS framework call-off. PO expected w/c 14 Dec but not yet raised in Salesforce.'},risks:'Year-end change freezes at two retail accounts.',upside:'Red Team extension at Marlow Capital.'},
  {key:'bd',pillar:'BD',name:'Business Development',mgr:'Richard M.',reps:['David H.','Francesca R.','Andy W.','Charlie M.','Harry B.','Serge L.','Eva R.','Harvey B.','Joel C.','Josh N.','Millie S.','Zuhaib H.'],status:'Submitted',subAt:'Fri 08:12',
   adj:{cur:-6000,prior:0,reason:'Haircut: two new-logo deals depend on January budget release.'},risks:'New-logo cycle is lengthening. Three deals have moved their close date twice.',upside:'Strong December inbound from the CE+ campaign.'},
  {key:'ca',pillar:'CA',name:'Channel & Alliances',mgr:'Kris R.',reps:['Simon C.','Miles A.','Tom C.','Ralph F.','Oscar K.','Noah D.','Connor C.','Rakee D.','Grace H.','Shawn M.'],status:'In progress',subAt:null,
   adj:{cur:12000,prior:15000,reason:'Two partner deal registrations approved but not yet created in Salesforce.'},risks:'',upside:''}
];
const UNIT=Object.fromEntries(UNITS.map(u=>[u.key,u]));
const STAGES=['Qualify','Solution Validation','Proposal / Bid Submitted','Negotiation / Commercial Agreement'];
const SHORT={'Qualify':'Qualify','Solution Validation':'Solution Val.','Proposal / Bid Submitted':'Proposal / Bid','Negotiation / Commercial Agreement':'Negotiation','Closed Won':'Closed Won','Closed Lost':'Closed Lost'};
const CAT={'Qualify':'Pipeline','Solution Validation':'Pipeline','Proposal / Bid Submitted':'Best Case','Negotiation / Commercial Agreement':'Commit','Closed Won':'Closed','Closed Lost':'Omitted'};
const PRE=['Northgate','Harbourline','Pennine','Ashcombe','Brightwater','Calder','Dunmore','Elmstead','Fernhill','Greyfriars','Halden','Ironbridge','Kingsmead','Larkfield','Marlow','Netherby','Oakhurst','Ravensworth','Severn','Thornbury','Wexcombe','Yarrow','Alderley','Bramcote','Coldharbour','Dovecote','Eastleigh','Foxley','Glenmore','Hollins','Kestrel','Linton','Moorgate','Pelham','Quayside','Redbourne','Stanmore','Tolworth','Upwell','Westbury'];
const SUF=['Logistics','Insurance','Housing Group','Healthcare','Engineering','Capital','Retail','Foods','Legal LLP','Academy Trust','Utilities','Manufacturing','Energy','Travel','Building Society','Council','Pharma','Data Centres','Freight','Wealth'];
const PROD=['Penetration Test (CREST)','MDR – 24/7 SOC','Cyber Essentials Plus','Vulnerability Management','Incident Response Retainer','Red Team Exercise','ISO 27001 Readiness','Phishing Simulation','vCISO Retainer','Cloud Security Review','SOC 2 Readiness','Web App Pen Test'];
const PARTNERS=['Northbeam IT','Castlegate Solutions','Kestrel Comms','G-Cloud framework','Brightline MSP'];
const NEXT=['Commercials agreed, awaiting PO','Proposal walkthrough Tue','Scoping call booked','Legal review of MSA','Budget sign-off at board 15 Dec','Procurement portal submission','Technical validation with IT lead','Renewal quote sent','Champion out until 4 Jan','Security questionnaire returned','Awaiting partner deal reg approval','Pricing revision requested'];
const OVR_NOTES=['Paper not with procurement yet','Champion confirmed budget, so pulled to Commit','Board date has already slipped once','Verbal yes from CFO','Competitive: incumbent MDR vendor came in late','PO raised, awaiting number'];
const usedAcct=new Set();
function acct(){let a;do{a=pick(PRE)+' '+pick(SUF)}while(usedAcct.has(a));usedAcct.add(a);return a}

const REPS={};const DEALS=[];let id=1;
function mk(u,rep,closed){
  const p=u.pillar;
  const gp=Math.round((p==='AM'?ri(3,24):p==='BD'?ri(3,20):ri(5,30))*1000/50)*50+ri(0,19)*50;
  const margin=0.32+rnd()*0.36;
  const type=p==='AM'?(rnd()<.62?'Renewal':'Expansion'):'New Business';
  const product=pick(PROD),rec=/MDR|Vulnerability|Retainer|Phishing|vCISO/.test(product);
  const term=rec?pick(type==='New Business'?[12,24,36]:[12,24,36,36]):12;
  const rev=Math.round(gp/margin/100)*100;
  const st={exists:true,stage:'',cat:'',mgr:'',close:'',gp,rev,tcv:Math.round(rev*term/12/100)*100};
  const d={id:'OPP-'+(24000+id++),unit:u.key,pillar:p,owner:rep,acct:acct(),product,term,basis:rnd()<.3?'Quote':'Estimated',type,partner:p==='CA'?pick(PARTNERS):(rnd()<.08?pick(PARTNERS):''),next:pick(NEXT),note:'',margin,cur:st,prior:null};
  if(closed){st.gp=Math.round(st.gp*.85/50)*50;st.rev=Math.round(st.gp/margin/100)*100;st.tcv=Math.round(st.rev*term/12/100)*100;st.stage='Closed Won';st.close=randDate('2026-10-05','2026-12-03');}
  else{
    st.stage=STAGES[pick([0,1,1,2,2,3,3,3])];
    const r=rnd();
    st.close=r<.05?randDate('2026-12-01','2026-12-10'):r<.8?randDate('2026-12-14','2026-12-31'):randDate('2027-01-08','2027-03-26');
  }
  d.prior={...st};
  DEALS.push(d);return d;
}
UNITS.forEach(u=>u.reps.forEach(rep=>{
  REPS[rep]={unit:u.key,target:(u.pillar==='AM'?ri(55,85):u.pillar==='BD'?ri(35,55):ri(40,65))*1000};
  for(let i=ri(0,1)+(rnd()<.55?1:0);i>0;i--)mk(u,rep,true);
  for(let i=ri(3,5);i>0;i--)mk(u,rep,false);
}));
// week-on-week movement since last Friday's snapshot
DEALS.forEach(d=>{
  const c=d.cur,p=d.prior;if(c.stage==='Closed Won')return;
  const idx=STAGES.indexOf(c.stage),r=rnd();
  if(r<.07){p.exists=false}
  else if(r<.16&&idx>=1){p.stage=STAGES[idx-1]}
  else if(r<.20&&idx<=2){p.stage=STAGES[idx+1]}
  else if(r<.225){p.close=randDate('2026-12-14','2026-12-31');c.close=randDate('2027-01-08','2027-03-20');if(idx<2){c.stage=p.stage=STAGES[2]}}
  else if(r<.255){c.close=randDate('2026-12-15','2026-12-31');p.close=randDate('2027-01-08','2027-03-15')}
  else if(r<.315){p.gp=Math.round(c.gp*(rnd()<.5?0.72+rnd()*.15:1.15+rnd()*.3)/50)*50;p.rev=Math.round(p.gp/d.margin/100)*100;p.tcv=Math.round(p.rev*d.term/12/100)*100}
  else if(r<.375){p.stage=STAGES[3];c.stage='Closed Won';if(c.close>Q.end||c.close<'2026-12-05')p.close=randDate('2026-12-14','2026-12-31');c.close=randDate('2026-12-07','2026-12-10')}
  else if(r<.39){p.stage=STAGES[pick([2,3])];c.stage='Closed Lost';if(c.close>Q.end)p.close=randDate('2026-12-14','2026-12-31');c.close='2026-12-09'}
});
DEALS.forEach(d=>{
  const c=d.cur,p=d.prior;c.cat=CAT[c.stage];p.cat=CAT[p.stage];c.mgr=c.cat;p.mgr=p.cat;
  const open=!c.stage.startsWith('Closed');
  if(open&&(c.cat==='Commit'||c.cat==='Best Case')&&rnd()<.16){
    c.mgr=c.cat==='Commit'?'Best Case':'Commit';d.note=pick(OVR_NOTES);
    if(p.exists&&p.stage===c.stage)p.mgr=c.mgr;
  }
});

/* ---------- state + maths ---------- */
const S={view:'cockpit',unit:'am-st',measure:'rev',week:6,locked:false,lockedAt:null,filter:'quarter',scope:'ALL',moveFilter:null,trendScope:'ALL',rscen:'call'};
const live=()=>S.week===6;
const editable=()=>live()&&!S.locked;
const W=()=>live()?'cur':'prior';
const inQ=st=>st.close>=Q.start&&st.close<=Q.end;
const v=st=>st[S.measure];
const mconv=x=>S.measure==='gp'?x:Math.round(x/0.45/100)*100;
const inCall=st=>st.exists&&inQ(st)&&(st.mgr==='Commit'||st.mgr==='Closed');
function totals(keys,which){
  which=which||W();
  const t={target:0,closed:0,commit:0,bc:0,pipe:0,repCommit:0,adj:0,lines:0,book:0,callRev:0,callQ:0};
  keys.forEach(k=>{const u=UNIT[k];u.reps.forEach(r=>t.target+=mconv(REPS[r].target));t.adj+=mconv(which==='cur'?u.adj.cur:u.adj.prior)});
  DEALS.forEach(d=>{
    if(!keys.includes(d.unit))return;const st=d[which];if(!st.exists)return;
    if(inQ(st)||inQ(d.cur))t.lines++;
    if(!inQ(st))return;const x=v(st);
    if(st.mgr==='Closed')t.closed+=x;else if(st.mgr==='Commit')t.commit+=x;else if(st.mgr==='Best Case')t.bc+=x;else if(st.mgr==='Pipeline')t.pipe+=x;
    if(st.cat==='Commit')t.repCommit+=x;
    if(st.mgr==='Commit'||st.mgr==='Closed'){t.book+=st.tcv;t.callRev+=st.rev;if(d.basis==='Quote')t.callQ+=st.rev}
  });
  t.call=t.closed+t.commit+t.adj;t.repCall=t.closed+t.repCommit;t.gap=t.target-t.call;
  t.cov=(t.commit+t.bc+t.pipe)/Math.max(1,t.target-t.closed);t.pct=t.call/Math.max(1,t.target);t.qb=t.callQ/Math.max(1,t.callRev);
  return t;
}
const ALLK=UNITS.map(u=>u.key);
const scopeKeys=s=>s==='ALL'?ALLK:PILLARS[s]?PILLARS[s].units:[s];
const scopeName=s=>s==='ALL'?'All pillars':PILLARS[s]?PILLARS[s].name:UNIT[s].name;
function classify(d){
  const p=d.prior,c=d.cur,pv=inCall(p)?v(p):0,cv=inCall(c)?v(c):0;
  if(!pv&&cv)return{k:!p.exists?'New':!inQ(p)?'Pulled in':'Upgraded',x:cv};
  if(pv&&!cv)return{k:c.stage==='Closed Lost'?'Lost':!inQ(c)?'Pushed out':'Downgraded',x:-pv};
  if(pv&&cv&&pv!==cv)return{k:cv>pv?'Amount up':'Amount down',x:cv-pv};
  if(pv&&cv&&p.mgr!=='Closed'&&c.mgr==='Closed')return{k:'Won',x:0,conv:cv};
  return null;
}
const BR_ORDER=['New','Pulled in','Upgraded','Amount up','Amount down','Downgraded','Pushed out','Lost','Adjustment'];
function bridge(keys){
  const b=Object.fromEntries(BR_ORDER.map(k=>[k,0]));let won=0;const movers=[];
  DEALS.forEach(d=>{if(!keys.includes(d.unit))return;const c=classify(d);if(!c)return;
    if(c.k==='Won'){won+=c.conv;movers.push({d,k:'Won',x:0,conv:c.conv});return}
    b[c.k]+=c.x;movers.push({d,k:c.k,x:c.x});});
  keys.forEach(k=>b.Adjustment+=mconv(UNIT[k].adj.cur)-mconv(UNIT[k].adj.prior));
  const start=totals(keys,'prior').call,end=totals(keys,'cur').call;
  return{b,start,end,won,movers};
}
function tags(d){
  const p=d.prior,c=d.cur,out=[];const open=!c.stage.startsWith('Closed');
  if(!live()){if(p.mgr!==p.cat&&!p.stage.startsWith('Closed'))out.push(['ovr','Override']);return out}
  if(!p.exists)out.push(['new','New']);
  if(c.stage==='Closed Won'&&p.stage!=='Closed Won')out.push(['won','Won']);
  if(c.stage==='Closed Lost'&&p.stage!=='Closed Lost')out.push(['lost','Lost']);
  if(p.exists&&inQ(p)&&!inQ(c))out.push(['push','Pushed → '+fmtDate(c.close)]);
  if(p.exists&&!inQ(p)&&inQ(c))out.push(['pull','Pulled in']);
  const pi=STAGES.indexOf(p.stage),ci=STAGES.indexOf(c.stage);
  if(p.exists&&pi>=0&&ci>=0&&ci>pi)out.push(['up','Stage ↑']);
  if(p.exists&&pi>=0&&ci>=0&&ci<pi)out.push(['down','Stage ↓']);
  if(p.exists&&v(p)!==v(c))out.push(['amt',(v(c)>v(p)?'£ ↑ ':'£ ↓ ')+money(Math.abs(v(c)-v(p)))]);
  if(open&&c.mgr!==c.cat)out.push(['ovr','Override']);
  if(open&&c.close<Q.fri)out.push(['due','Overdue']);
  return out;
}

/* ---------- formatting ---------- */
function money(x){const a=Math.abs(x),s=x<0?'−':'';if(a>=1e6)return s+'£'+(a/1e6).toFixed(2)+'m';if(a>=1e5)return s+'£'+Math.round(a/1e3)+'k';if(a>=1e3)return s+'£'+(a/1e3).toFixed(1)+'k';return s+'£'+Math.round(a)}
const sgn=x=>(x>0?'+':x<0?'':'±')+money(x);
const dcls=x=>x>0?'pos':x<0?'neg':'muted';
const pct=x=>Math.round(x*100)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catCls=c=>c.split(' ')[0];
const mLabel=()=>S.measure==='gp'?'GP in Year':'Revenue in Year';

function kpi(l,val,d,hl){return`<div class="card kpi${hl?' hl':''}"><div class="l">${l}</div><div class="v">${val}</div><div class="d">${d||'&nbsp;'}</div></div>`}

function waterfall(br){

  steps.forEach((st,i)=>{const x=i*bw+bw*.16,w=bw*.68;let y1,y2,fill;
    if(st.t==='total'){y1=y(st.v);y2=bot;fill='#1d1d1b'}else{const a=st.from,b=st.from+st.v;y1=y(Math.max(a,b));y2=y(Math.min(a,b));fill=st.v>0?'#a6ff33':st.v<0?'#e46a6a':'#d8dadd'}

    <text x="${x+w/2}" y="${y1-7}" text-anchor="middle" font-size="12" font-weight="700" fill="${st.t==='total'?'#1d1d1b':st.v<0?'#c93c3c':st.v>0?'#3b7a00':'#8a8e96'}">${st.t==='total'?money(st.v):st.v?sgn(st.v):'–'}</text>
    <text x="${x+w/2}" y="${bot+18}" text-anchor="middle" font-size="11.5" fill="#5d626c">${st.l}</text></g>`;

  });
  return s+'</svg></div>';
}

/* ---------- bookings → revenue (revenue schedule) ---------- */
const FYM=['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12','2027-01','2027-02','2027-03'];
const MLAB=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
const NOWI=8; // Dec 2026 = month in progress; Apr–Nov are actuals
const RT={
  'Spread evenly':{c:'#1d1d1b',ex:'MDR / SOC, vulnerability management, vCISO and IR retainers, licences',how:'Annual value ÷ 12, every month of the term'},
  'On delivery':{c:'#00808a',ex:'Pen tests, Cyber Essentials Plus, red team, readiness work, reviews',how:'All of it in the month the work is delivered'},
  'Per occurrence':{c:'#7a5af8',ex:'Repeating work such as quarterly phishing simulations',how:'Split across each occurrence (here, quarterly)'},
  'As used':{c:'#b7791f',ex:'Time & materials and consumption (drawdown) services',how:'When the hours or units are used'}
};
const rtype=p=>/MDR|Vulnerability|vCISO|Incident Response/.test(p)?'Spread evenly':/Phishing/.test(p)?'Per occurrence':'On delivery';
// fictional base book (not DXR figures): earned actuals Apr–Nov, plus contracted revenue still to come
const BASE_ACT=[688,712,701,742,729,768,781,796].map(x=>x*1000);
const BASE_CON=[0,0,0,0,0,0,0,0,736,708,694,671].map(x=>x*1000);
const FY_TARGET=9800000; // placeholder until DXR's FY27 targets are loaded
const mIdx=d=>{const [y,m]=d.slice(0,7).split('-').map(Number);return (y-2026)*12+m-4}; // 0 = Apr 2026
function schedule(d,st){
  // returns {fy:[12], later:n} of revenue from one deal, starting the month after close
  const out=new Array(12).fill(0);let later=0;const t=rtype(d.product),start=mIdx(st.close)+1;
  const put=(i,x)=>{if(i<12)out[Math.max(i,0)]+=x;else later+=x};
  if(t==='Spread evenly'){const mo=st.tcv/d.term;for(let k=0;k<d.term;k++)put(start+k,mo)}
  else if(t==='Per occurrence'){const n=Math.max(1,Math.round(d.term/3)),x=st.tcv/n;for(let k=0;k<n;k++)put(start+k*3,x)}
  else put(start,st.tcv);
  return{fy:out,later,type:t};
}
function revModel(){
  const cats=S.rscen==='bc'?['Commit','Best Case']:['Commit'];
  const won=new Array(12).fill(0),call=new Array(12).fill(0),bc=new Array(12).fill(0);
  const byType={},byPillar={},deals=[];let wonLater=0;
  Object.keys(RT).forEach(k=>byType[k]={book:0,fy:0,later:0,n:0});
  Object.keys(PILLARS).forEach(k=>byPillar[k]={book:0,fy:0,later:0});
  DEALS.forEach(d=>{const st=d.cur;if(!st.exists||!inQ(st))return;
    const isWon=st.mgr==='Closed',inScen=cats.includes(st.mgr);if(!isWon&&!inScen)return;
    const r=schedule(d,st),fy=r.fy.reduce((a,b)=>a+b,0);
    const tgt=isWon?won:st.mgr==='Best Case'?bc:call;r.fy.forEach((x,i)=>tgt[i]+=x);if(isWon)wonLater+=r.later;
    if(!isWon){const T=byType[r.type],P=byPillar[d.pillar];T.book+=st.tcv;T.fy+=fy;T.later+=r.later;T.n++;P.book+=st.tcv;P.fy+=fy;P.later+=r.later;deals.push({d,st,fy,later:r.later,type:r.type})}
  });
  const act=FYM.map((m,i)=>i<NOWI?BASE_ACT[i]:0),con=FYM.map((m,i)=>i>=NOWI?BASE_CON[i]+won[i]:0);
  // wins already delivered this quarter count as actuals in their month
  for(let i=0;i<NOWI;i++)act[i]+=won[i];
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const book=deals.reduce((a,x)=>a+x.st.tcv,0),fyCall=sum(call),fyBc=sum(bc),later=deals.reduce((a,x)=>a+x.later,0);
  return{act,con,call,bc,byType,byPillar,deals,book,fyCall,fyBc,later,
    A:sum(act),C:sum(con),landing:sum(act)+sum(con)+fyCall+fyBc};
}

   <div class="step"><div class="when">4 · Exec view</div><h3>Actual + contracted + forecast</h3><p>One FY27 number against target, by month, revenue type and pillar.</p></div>
  </div>
  <div class="chips" style="margin-top:14px"><button class="chip ${S.rscen==='call'?'on':''}" data-rscen="call">Manager call (Commit)</button><button class="chip ${S.rscen==='bc'?'on':''}" data-rscen="bc">Call + Best Case</button>
    <span class="muted" style="font-size:12.5px;align-self:center">Uses the manager categories from the Friday forecast, so a change on the Pillar &amp; team page flows through here.</span></div>
  <div class="grid kpis">
    ${kpi('FY27 earned to date',money(m.A),'Apr–Nov actuals')}
    ${kpi('Contracted, Dec–Mar',money(m.C),'won deals already scheduled')}
    ${kpi('Bookings in the forecast',money(m.book),scen+', this quarter')}
    ${kpi('…of which revenue in FY27',money(m.fyCall+m.fyBc),pct((m.fyCall+m.fyBc)/Math.max(1,m.book))+' of those bookings',true)}
    ${kpi('…and in FY28 onwards',money(m.later),'recurring tail, beyond 31 Mar')}
    ${kpi('FY27 landing',money(m.landing),'actual + contracted + forecast')}
    ${kpi('FY27 target',money(FY_TARGET),'placeholder until targets load')}
    ${kpi('Landing vs target',pct(pctT),(m.landing-FY_TARGET>=0?'+':'−')+money(Math.abs(m.landing-FY_TARGET)).replace('−',''))}
  </div>
  <div class="card" style="margin-top:14px"><h2>FY27 revenue by month</h2><div class="sub">Actuals, then contracted revenue, then what this quarter's forecast adds once each deal's revenue type is applied.</div>${revChart(m)}
    <div class="legend"><span><i style="background:#1d1d1b"></i>Actual</span><span><i style="background:#00808a"></i>Contracted</span><span><i style="background:#a6ff33"></i>Forecast: Commit</span>${S.rscen==='bc'?'<span><i style="background:#9ff3f3"></i>Forecast: Best Case</span>':''}</div></div>
  <div class="card" style="margin-top:14px"><h2>Why bookings and revenue differ: revenue type</h2><div class="sub">Same forecast, split by how each product earns its revenue. One-off work lands in FY27 almost in full; multi-year recurring work mostly lands in later years.</div>
    <div class="scroll"><table><thead><tr><th>Revenue type</th><th>How it's scheduled</th><th class="r">Deals</th><th class="r">Bookings</th><th class="r">FY27 revenue</th><th class="r">FY28+</th><th class="r">Lands in FY27</th></tr></thead><tbody>${typeRows}</tbody></table></div></div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>By pillar</h2><div class="sub">${scen}. Bookings versus the revenue they create this year.</div>
      <div class="scroll"><table><thead><tr><th>Pillar</th><th class="r">Bookings</th><th class="r">FY27 revenue</th><th class="r">FY28+</th><th class="r">Lands in FY27</th></tr></thead><tbody>${pRows}</tbody></table></div></div>
    <div class="card dark"><h2>Worked example</h2><ul class="tight" style="font-size:13.5px;color:#cfd1d5">
      <li><b style="color:#fff">3-year MDR, £96k booking</b>, closing mid-December: spread evenly at £2.7k a month from January → <b style="color:#a6ff33">£8k in FY27</b>, £88k in FY28 onwards.</li>
      <li><b style="color:#fff">£18k pen test</b>, closing the same week: on delivery in January → <b style="color:#a6ff33">£18k in FY27</b>.</li>
      <li>Both are £-for-£ the same in a bookings forecast. Only one moves this year's revenue.</li></ul>
      <p style="font-size:13px;color:#b9bcc2;margin:12px 0 0">Rule used here: revenue starts the month after close. In Salesforce the contract start date on the deal overrides it.</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Biggest bookings in the forecast</h2><div class="sub">What each one is worth this year versus later.</div>
    <div class="scroll"><table><thead><tr><th>Deal</th><th>Manager cat.</th><th>Close</th><th>Revenue type</th><th class="r">Term</th><th class="r">Booking</th><th class="r">FY27 revenue</th><th class="r">FY28+</th></tr></thead><tbody>${top||'<tr><td colspan="8" class="muted">None</td></tr>'}</tbody></table></div></div>`;
}

function viewRhythm(){
  const t=totals(ALLK);
  return`
  <div class="hero"><div><h1>The Friday rhythm</h1><p>One working week, one meeting, one snapshot. Reps keep working in Opportunity as normal. The forecast reads it live and freezes it after the meeting.</p></div></div>
  <div class="steps">
   <div class="step"><div class="when">Sat (auto)</div><h3>Week opens</h3><p>W12 is created and lines are cloned from W11. Manager categories and notes carry forward, so managers only re-judge what changed.</p></div>
   <div class="step"><div class="when">Mon – Wed</div><h3>Reps update deals</h3><p>Stage, close date, amount and next step on the Opportunity. The cockpit syncs on load and also runs nightly. No Opportunity trigger is added.</p></div>
   <div class="step"><div class="when">Thu by 17:00</div><h3>Managers submit</h3><p>Set the manager category, add notes, a signed adjustment with a reason, and risks and upside. Then click Submit.</p></div>
   <div class="step ${S.locked?'':'now'}"><div class="when">Fri 10:00</div><h3>Forecast meeting</h3><p>The CCO runs it from the roll-up, then drills into each pillar and walks the variance bridge. Calls changed in the meeting are made live.</p></div>
   <div class="step ${S.locked?'now':''}"><div class="when">Fri after meeting</div><h3>Lock &amp; snapshot</h3><p>A final sync, then movement and variance against the prior line. Lines, submissions and targets are frozen. Auto-lock runs at 18:00 if this is missed.</p></div>
  </div>
  <div class="grid half" style="margin-top:14px">
   <div class="card"><h2>This week</h2><div class="sub">${Q.label} · W11 · w/e Fri 11 Dec 2026</div>
    <table><tbody>${UNITS.map(u=>`<tr><td>${u.name}</td><td>${u.mgr}</td><td>${statusBadge(u)}</td></tr>`).join('')}
    <tr><td>Lines in scope</td><td colspan="2" class="num">${t.lines}</td></tr><tr><td>Manager call</td><td colspan="2" class="num"><b>${money(t.call)}</b> (${mLabel()})</td></tr></tbody></table>
    <div class="lockbar" style="margin-top:14px">${live()?(S.locked?`<span class="badge locked">Locked ${S.lockedAt}</span><span class="muted">W12 is open with carry-forward.</span>`:`<button class="btn dark" data-lock="1">Lock &amp; snapshot W11</button><span class="muted" style="font-size:12.5px">CCO / RevOps only (DXR_Forecast_Admin)</span>`):'<span class="muted">Switch to W11.</span>'}</div></div>
   <div class="card dark"><h2>What a snapshot stores</h2><ul class="tight" style="color:#cfd1d5;font-size:13.5px">
    <li><b style="color:#fff">1 Forecast_Week__c</b>: status Locked, who and when, Manual or Auto</li>
    <li><b style="color:#fff">4 Forecast_Submission__c</b>: target, closed, commit, best case, pipeline, adjustment, call, prior call, commentary</li>
    <li><b style="color:#fff">${t.lines} Forecast_Line__c</b>: per deal: stage, rep category, manager category, close date, revenue in year, bookings, GP, next step, note, prior values, movement, call variance</li>
    <li>The owner's <b style="color:#fff">pillar is stamped</b>, so a later re-org never rewrites history</li>
    <li>Revenue in Year, Bookings (TCV) and GP are all stored, plus whether each line is quote-backed or estimated</li></ul></div>
  </div>`;
}

function viewBuild(){
  return`
  <div class="hero"><div><h1>How it's built</h1><p>Three custom objects, one LWC cockpit on a Lightning App Page, Apex for sync and lock, and standard reports on the snapshots. Full spec: <b>XYP-FCST-001</b>.</p></div></div>
  <div class="grid half">
   <div class="card"><h2>Data model</h2><div class="sub">Week → Submission → Line (master-detail). Lines look up to Opportunity, so deleting a deal never deletes history.</div>
    <div class="obj"><div class="h">Forecast_Week__c<span>1 per Friday</span></div><ul><li><code>Week_Ending__c</code>, <code>Week_Number__c</code>, quarter start/end</li><li><code>Status__c</code> Open · Locked · <code>Locked_At__c</code> / <code>Locked_By__c</code> / <code>Lock_Method__c</code></li><li><code>Prior_Week__c</code> · <code>Meeting_Notes__c</code></li></ul></div>
    <div class="arrow">▼ master-detail</div>
    <div class="obj"><div class="h">Forecast_Submission__c<span>1 per unit per week</span></div><ul><li><code>Pillar__c</code>, <code>Forecast_Unit__c</code>, <code>Manager__c</code>, <code>Status__c</code></li><li>Rollups: Closed / Commit / Best Case / Pipeline / Rep Commit (GP + Rev)</li><li><code>Manager_Adjustment_GP__c</code> + reason · <code>Manager_Call_GP__c</code> · <code>Prior_Call_GP__c</code> · <code>Call_Variance_GP__c</code></li><li><code>Key_Risks__c</code> / <code>Key_Upside__c</code></li></ul></div>
    <div class="arrow">▼ master-detail</div>
    <div class="obj"><div class="h">Forecast_Line__c<span>1 per deal per week</span></div><ul><li><code>Opportunity__c</code> (lookup) · Owner · stamped <code>Pillar__c</code></li><li><code>Rep_Category__c</code> (from the opp) vs <code>Manager_Category__c</code> (judgement)</li><li>Stage, close, <code>GP_In_Year__c</code>, <code>Revenue__c</code>, next step, note</li><li><code>Prior_Line__c</code> + Prior_* values · <code>Movement__c</code> · <code>Call_Variance_GP__c</code></li></ul></div>
   </div>
   <div class="grid" style="align-content:start">
    <div class="card"><h2>Forecast hierarchy: new commercial structure</h2><div class="sub">Comes from <code>User.Forecast_Pillar__c</code> / <code>Forecast_Unit__c</code>, loaded once from the new structure at cutover. Roles are not used. A future re-org is a data change, not a rebuild.</div>
     <div class="tree"><div class="p">Chief Commercial Officer <span class="muted" style="font-weight:400">· reviews &amp; locks</span></div>
     ${Object.entries(PILLARS).map(([k,P])=>`<div class="p">${P.name}</div>${P.units.map(u=>`<div class="u">${UNIT[u].mgr} <span>· ${UNIT[u].reps.length} reps · submits</span></div>`).join('')}`).join('')}
     <div class="p dim" style="font-weight:500">Sales Enablement / Bid · Pre-sales · Marketing: not forecast (phase 1)</div></div></div>
    <div class="card"><h2>Components</h2><ul class="tight" style="font-size:13.5px">
     <li><b>LWC</b>: <code>dxrForecastCockpit</code> (container), <code>…Header</code>, <code>…Rollup</code>, <code>…Unit</code>, <code>…DealGrid</code> (inline-edit datatable), <code>…Bridge</code>, <code>…Trend</code>, <code>…LockModal</code></li>
     <li><b>Apex</b>: <code>ForecastController</code>, <code>ForecastSyncService</code>, <code>ForecastLockService</code> (Queueable), <code>ForecastMovement</code>, auto-lock (Fri 18:00) + nightly sync schedulers</li>
     <li><b>Security</b>: <code>DXR_Forecast_Manager</code>, <code>DXR_Forecast_Admin</code> (+ unlock custom permission). VRs block edits once locked.</li>
     <li><b>Reports</b>: call trend, variance by movement, slipped deals, judgement delta, accuracy · <b>DXR Weekly Forecast</b> dashboard</li></ul></div>
    <div class="card"><h2>Revenue in Year, from the pricing tool</h2><div class="sub">The call measure. Bookings (TCV = Amount) is what DXR reports today, and it stays visible as a column.</div>
     <ul class="tight" style="font-size:13.5px"><li>Every Pricing Desk line has a <b>Revenue Class</b>, a <b>start month</b> and a <b>line months</b> value. The new <code>In_Year_Revenue__c</code> on each line counts months 1–12 of a recurring line, plus any one-off or repeatable line that starts in year 1. It is the same rule as <code>In_Year_GP__c</code>, applied to price.</li>
     <li>QuoteSyncService sums it to <code>Quote_In_Year_Revenue__c</code> on the opp.</li>
     <li><code>Reporting_Revenue_In_Year__c</code> = the quote value, else <b>Amount × 12 ÷ term</b> (shown as <b>Est.</b>).</li>
     <li>Example: 3-yr MDR at £30k/yr + £6k onboarding gives Bookings <b>£96k</b>, Revenue in Year <b>£36k</b> and an estimate of £32k.</li>
     <li>Why it matters: 183 of 827 open DXR deals are multi-year. They hold £27.4m of the £33.1m open bookings.</li></ul></div>
    <div class="card"><h2>Bookings → revenue: the revenue schedule</h2><div class="sub">Already built in the sandbox (XYP-REV-001/002). The forecast reads it rather than recalculating.</div>
     <ul class="tight" style="font-size:13.5px"><li><code>Product2.Revenue_Method__c</code>: Spread evenly · On delivery · Per occurrence · As used (plus Point in time and With service).</li>
     <li><code>Revenue_Schedule__c</code>: one row per line per month. Won deals are <b>Contracted</b>; open deals get <b>Forecast</b> rows from close date (or contract start) and term.</li>
     <li>Forecast rows read the live deal's category, so the Friday call drives the revenue forecast with no extra entry.</li>
     <li>Financial year April–March, with This FY / Last FY / Next FY filters.</li>
     <li>Proposed: the lock also stores each line's FY revenue and later-years revenue, so the revenue forecast has a weekly history too.</li></ul></div>
    <div class="card"><h2>Decisions</h2><ol class="tight" style="font-size:13.5px">
     <li>✅ Pillar = <b>deal owner</b></li>
     <li>✅ Sales forecast <b>bookings</b>; the exec view converts them to <b>revenue</b> by revenue type. <b>Still to confirm:</b> are FY27 targets set on bookings, revenue, or both?</li>
     <li>✅ Built on the new commercial structure. DXR to supply the go-live date and the roster.</li>
     <li>✅ Renewals stay in the forecast, with a Type filter</li>
     <li>Open: who can lock (CCO only, or + RevOps), and is the 18:00 auto-lock right?</li>
     <li>Open: can managers see other units before the meeting?</li></ol></div>
   </div>
  </div>`;
}

/* ---------- lock modal ---------- */
function openLock(){
  const t=totals(ALLK),pending=UNITS.filter(u=>u.status!=='Submitted');
  document.getElementById('modalHost').innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="lk">
   <h2 id="lk">Lock W11 and take the snapshot?</h2><p class="muted" style="margin:0 0 12px">This freezes every line and submission for w/e Fri 11 Dec and opens W12 with manager categories and notes carried forward.</p>
   ${UNITS.map(u=>`<div class="row"><span>${u.name}</span>${statusBadge(u)}</div>`).join('')}
   <div class="row"><span>Lines to snapshot</span><b class="num">${t.lines}</b></div>
   <div class="row"><span>Manager call (${mLabel()})</span><b class="num">${money(t.call)}</b></div>
   ${pending.length?`<div class="note-box" style="margin-top:12px;background:#fff3dc;color:var(--warn)"><b style="color:var(--warn)">${pending.map(u=>u.mgr).join(', ')}</b> has not submitted. Locking now snapshots their current working lines as they stand.</div>`:''}
   <div class="acts"><button class="btn ghost" id="cancelLock">Cancel</button><button class="btn dark" id="confirmLock">Lock &amp; snapshot</button></div></div></div>`;
  document.getElementById('cancelLock').onclick=closeModal;
  document.getElementById('scrim').onclick=e=>{if(e.target.id==='scrim')closeModal()};
  document.getElementById('confirmLock').onclick=()=>{S.locked=true;S.lockedAt='Fri 11 Dec 11:47';closeModal();render();toast(`Snapshot saved: <b>${t.lines} lines</b> · 4 submissions · W12 opened`)};
}
function closeModal(){document.getElementById('modalHost').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
let tt;function toast(h){const el=document.getElementById('toast');el.innerHTML=h;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3200)}

/* ---------- render + events ---------- */
function render(){
  renderHeader();
  const app=document.getElementById('app');
  app.innerHTML=({cockpit:viewCockpit,revenue:viewRevenue,unit:viewUnit,variance:viewVariance,trend:viewTrend,rhythm:viewRhythm,build:viewBuild})[S.view]();
}
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-rscen],[data-unit],[data-filter],[data-scope],[data-mf],[data-tscope],[data-go],[data-lock],#submitBtn');if(!el)return;
  if(el.dataset.rscen){S.rscen=el.dataset.rscen;render();return}
  if(el.dataset.unit){S.unit=el.dataset.unit;S.view='unit';S.filter='quarter';render();if(e.target.closest('tr'))window.scrollTo({top:0});return}
  if(el.dataset.filter){S.filter=el.dataset.filter;render();return}
  if(el.dataset.scope){S.scope=el.dataset.scope;S.moveFilter=null;render();return}
  if(el.dataset.mf!==undefined){S.moveFilter=el.dataset.mf&&S.moveFilter!==el.dataset.mf?el.dataset.mf:null;render();return}
  if(el.dataset.tscope){S.trendScope=el.dataset.tscope;render();return}
  if(el.dataset.go){S.view=el.dataset.go;render();window.scrollTo({top:0});return}
  if(el.dataset.lock){openLock();return}
  if(el.id==='submitBtn'){const u=UNIT[S.unit];
    const a=+document.getElementById('adj').value||0,r=document.getElementById('adjR').value.trim();
    if(a!==0&&!r){toast('An adjustment needs a reason (VR-F2)');document.getElementById('adjR').focus();return}
    u.adj.cur=S.measure==='gp'?a:Math.round(a*0.45);u.adj.reason=r;u.risks=document.getElementById('risks').value;u.upside=document.getElementById('upside').value;
    u.status='Submitted';u.subAt='Fri 09:31';render();toast(`<b>${u.name}</b> submitted · call ${money(totals([u.key]).call)}`)}
});
app.addEventListener('change',e=>{
  const m=e.target.dataset.mgr;if(m){const d=DEALS.find(x=>x.id===m);d.cur.mgr=e.target.value;const y=window.scrollY;render();window.scrollTo({top:y});toast(`Manager category → <b>${e.target.value==='Omitted'?'Omit':e.target.value}</b> · ${esc(d.acct)}`)}
  if(e.target.id==='adj'){const u=UNIT[S.unit],a=+e.target.value||0;u.adj.cur=S.measure==='gp'?a:Math.round(a*0.45);const y=window.scrollY;render();window.scrollTo({top:y})}
});
app.addEventListener('input',e=>{const n=e.target.dataset.note;if(n){DEALS.find(x=>x.id===n).note=e.target.value}});
render();
</script>
</body>
</html>
